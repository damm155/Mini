name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.14). Leave empty to skip GitHub Release upload'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '28.0.13004108'
  GO_VERSION: '1.25.0'
  COMPILE_SDK: '36'
  BUILD_TOOLS: '35.0.0'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-native-deps:
    name: Build native dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 镜像预装的 sdkmanager 可能与 Google 仓库索引不同步（报
      # "Failed to find package 'tools'" 并以 exit code 1 退出）。
      # 这里优先下载官方 cmdline-tools 放到 cmdline-tools/latest，
      # 下载失败则退回镜像预装版本；所有组件装完都在磁盘上校验，
      # 单个包的无害告警不会中断整个步骤。
      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            for u in \
              "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            do
              curl -fsSL -o /tmp/ct.zip "$u" && break || echo "::warning::cmdline-tools download failed: $u"
            done
            if [ -s /tmp/ct.zip ]; then
              unzip -q -o /tmp/ct.zip -d /tmp/ct
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
            if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "sdkmanager = $SDKMANAGER"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          # 刷新仓库元数据，避免索引过旧导致找不到包
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --update || true

          for pkg in \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "platforms;android-24" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}"
          do
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$pkg" || echo "::warning::sdkmanager exited non-zero for $pkg"
          done

          # NDK：先看磁盘上有没有，再尝试安装已知 r28 版本号，最后退回任意预装 NDK
          NDK_DIR=""
          for v in "${NDK_VERSION}" 28.0.12433566 28.1.13356709 28.2.13676358; do
            if [ -d "$ANDROID_HOME/ndk/$v" ]; then NDK_DIR="$ANDROID_HOME/ndk/$v"; break; fi
          done
          if [ -z "$NDK_DIR" ]; then
            for v in "${NDK_VERSION}" 28.0.12433566 28.1.13356709 28.2.13676358; do
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;$v" || echo "::warning::sdkmanager exited non-zero for ndk;$v"
              if [ -d "$ANDROID_HOME/ndk/$v" ]; then NDK_DIR="$ANDROID_HOME/ndk/$v"; break; fi
            done
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No usable NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi

          test -d "$ANDROID_HOME/platforms/android-${COMPILE_SDK}" || { echo "::error::platform android-${COMPILE_SDK} missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" || { echo "::error::build-tools ${BUILD_TOOLS} missing"; exit 1; }
          test -d "$ANDROID_HOME/cmake/${CMAKE_VERSION}" || { echo "::error::cmake ${CMAKE_VERSION} missing"; exit 1; }

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Selected NDK: $NDK_DIR"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gomobile
        run: |
          set -eux
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache native build artifacts
        uses: actions/cache@v4
        id: cache-native
        with:
          path: |
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/assets/alpine-minirootfs.tar.gz
            src/android/app/src/main/jniLibs/arm64-v8a/
            src/android/app/libs/rclone.aar
          key: native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-go${{ env.GO_VERSION }}-${{ hashFiles('deps/build_proot.sh', 'deps/build_rclone_android.sh', 'scripts/prepare_android_sandbox.sh') }}

      - name: Build PRoot (arm64)
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          set -eux
          # zip 导入的仓库里子模块目录是空的（没有 gitlink），按需克隆 proot 分支仓库
          if [ -z "$(ls -A deps/proot 2>/dev/null || true)" ]; then
            echo "deps/proot is empty - cloning the OpenMinis fork"
            rm -rf deps/proot
            git clone --depth 1 https://github.com/OpenMinis/proot.git deps/proot
          fi
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Build rclone AAR
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          set -eux
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/
          ls -lh src/android/app/libs/

      - name: Prepare Android sandbox assets
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          set -eux
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-deps
          path: |
            src/android/app/src/main/assets/
            src/android/app/src/main/jniLibs/
            src/android/app/libs/
          retention-days: 1

  build-apk:
    name: Build Release APK
    needs: build-native-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-deps
          path: /tmp/native-deps

      - name: Restore native artifacts
        run: |
          set -eux
          mkdir -p src/android/app/src/main/assets/
          mkdir -p src/android/app/src/main/jniLibs/arm64-v8a/
          mkdir -p src/android/app/libs/
          # artifact 解压后的目录层级不固定，按文件名反查所在目录，兼容任何结构
          ASSETS_SRC=$(find /tmp/native-deps -type f \( -name 'proot-aarch64' -o -name 'alpine-minirootfs.tar.gz' \) -printf '%h\n' | head -n1 || true)
          JNILIBS_SRC=$(find /tmp/native-deps -type d -name 'arm64-v8a' | head -n1 || true)
          LIBS_SRC=$(find /tmp/native-deps -type f -name 'rclone.aar' -printf '%h\n' | head -n1 || true)
          echo "ASSETS_SRC=$ASSETS_SRC JNILIBS_SRC=$JNILIBS_SRC LIBS_SRC=$LIBS_SRC"
          if [ -n "$ASSETS_SRC" ]; then cp -a "$ASSETS_SRC/." src/android/app/src/main/assets/; fi
          if [ -n "$JNILIBS_SRC" ]; then cp -a "$JNILIBS_SRC/." src/android/app/src/main/jniLibs/arm64-v8a/; fi
          if [ -n "$LIBS_SRC" ]; then cp -a "$LIBS_SRC/." src/android/app/libs/; fi
          echo "=== Assets ==="
          ls -lh src/android/app/src/main/assets/ || true
          echo "=== JNI Libs ==="
          ls -lh src/android/app/src/main/jniLibs/arm64-v8a/ || true
          echo "=== Libs ==="
          ls -lh src/android/app/libs/ || true
          test -f src/android/app/libs/rclone.aar
          test -f src/android/app/src/main/assets/proot-aarch64

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            for u in \
              "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            do
              curl -fsSL -o /tmp/ct.zip "$u" && break || echo "::warning::cmdline-tools download failed: $u"
            done
            if [ -s /tmp/ct.zip ]; then
              unzip -q -o /tmp/ct.zip -d /tmp/ct
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
            if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "sdkmanager = $SDKMANAGER"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --update || true

          for pkg in \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}"
          do
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "$pkg" || echo "::warning::sdkmanager exited non-zero for $pkg"
          done

          NDK_DIR=""
          for v in "${NDK_VERSION}" 28.0.12433566 28.1.13356709 28.2.13676358; do
            if [ -d "$ANDROID_HOME/ndk/$v" ]; then NDK_DIR="$ANDROID_HOME/ndk/$v"; break; fi
          done
          if [ -z "$NDK_DIR" ]; then
            for v in "${NDK_VERSION}" 28.0.12433566 28.1.13356709 28.2.13676358; do
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;$v" || echo "::warning::sdkmanager exited non-zero for ndk;$v"
              if [ -d "$ANDROID_HOME/ndk/$v" ]; then NDK_DIR="$ANDROID_HOME/ndk/$v"; break; fi
            done
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No usable NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi

          test -d "$ANDROID_HOME/platforms/android-${COMPILE_SDK}" || { echo "::error::platform android-${COMPILE_SDK} missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" || { echo "::error::build-tools ${BUILD_TOOLS} missing"; exit 1; }
          test -d "$ANDROID_HOME/cmake/${CMAKE_VERSION}" || { echo "::error::cmake ${CMAKE_VERSION} missing"; exit 1; }

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Selected NDK: $NDK_DIR"

      - name: Grant execute permission for gradlew
        working-directory: src/android
        run: chmod +x gradlew

      - name: Create provider-customization.properties
        working-directory: src/android/app
        run: |
          if [ -f provider-customization.properties.example ]; then
            cp provider-customization.properties.example provider-customization.properties
          else
            touch provider-customization.properties
          fi
          cat provider-customization.properties

      - name: Build Release APK
        working-directory: src/android
        run: |
          set -eux
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-mapping
          path: src/android/app/build/outputs/mapping/release/
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build-apk
    if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release/

      - name: Get version info
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          APK_FILE=$(ls release/*.apk | head -1)
          echo "apk=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          echo "APK: $(basename "$APK_FILE")"

      - name: Rename APK
        run: |
          mv release/*.apk "release/OpenMinis-${{ steps.version.outputs.tag }}-release.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenMinis ${{ steps.version.outputs.tag }}
          body: |
            ## OpenMinis ${{ steps.version.outputs.tag }}

            Android Release APK

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" in your device settings
            3. Install the APK

            ### Notes
            - This is a Release build with ProGuard optimizations enabled
            - Requires Android 8.0 (API 26) or later
            - Supports arm64-v8a architecture only
          files: |
            release/*.apk
          draft: false
          prerelease: false
